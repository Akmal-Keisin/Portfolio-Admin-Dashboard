name: portfolio-dashobard

services:
    app:
        build:
            context: ..
            dockerfile: deploy/Dockerfile
        image: portfolio-dashboard:latest
        container_name: portfolio-dashboard
        restart: unless-stopped
        env_file:
            - ../.env
        environment:
            DB_CONNECTION: mariadb
            DB_HOST: shared_mariadb
            DB_PORT: 3306
        volumes:
            - portfolio_admin_storage_data:/app/storage
        networks:
            - traefik-proxy
            - db-net
        labels:
            - 'traefik.enable=true'
            - 'traefik.http.routers.portfolio.rule=Host(`portfolio-admin.akmalkeisin.com`)'
            - 'traefik.http.routers.portfolio.entrypoints=websecure'
            - 'traefik.http.routers.portfolio.tls=true'
            - 'traefik.http.routers.portfolio.tls.certresolver=le'

    # --- Optional: queue worker, same image, different process -------------
    # queue:
    #   image: portfolio-dashboard:latest
    #   container_name: portfolio-dashobard_queue
    #   restart: unless-stopped
    #   env_file: [../.env]
    #   environment:
    #     DB_CONNECTION: pgsql
    #     DB_HOST: shared_postgres
    #     DB_DATABASE: ${DB_DATABASE:-portfolio-dashobard}
    #     DB_USERNAME: ${DB_USERNAME:-portfolio-dashobard}
    #     DB_PASSWORD: ${DB_PASSWORD}
    #   command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    #   volumes:
    #     - storage_data:/app/storage
    #   networks: [db-net]
    #   entrypoint: []   # skip migrate/cache steps from the main entrypoint

    # --- Optional: scheduler (cron replacement) -----------------------------
    # scheduler:
    #   image: portfolio-dashboard:latest
    #   container_name: portfolio-dashobard_scheduler
    #   restart: unless-stopped
    #   env_file: [../.env]
    #   environment:
    #     DB_CONNECTION: pgsql
    #     DB_HOST: shared_postgres
    #     DB_DATABASE: ${DB_DATABASE:-portfolio-dashobard}
    #     DB_USERNAME: ${DB_USERNAME:-portfolio-dashobard}
    #     DB_PASSWORD: ${DB_PASSWORD}
    #   entrypoint: ["sh", "-c"]
    #   command: ["while true; do php artisan schedule:run --no-interaction; sleep 60; done"]
    #   volumes:
    #     - storage_data:/app/storage
    #   networks: [db-net]

networks:
    traefik-proxy:
        external: true
        name: traefik-proxy
    db-net:
        external: true
        name: db-net

volumes:
    portfolio_admin_storage_data:
        name: portfolio_admin_storage_data
